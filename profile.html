<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BrainStorm Profile</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .container {
            text-align: center;
            padding: 20px;
        }
        .logo {
            width: 80px;
            height: 80px;
            background: white;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
        }
        .logo span {
            font-size: 50px;
        }
        h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }
        p {
            font-size: 16px;
            opacity: 0.9;
        }
        .loading {
            display: inline-block;
            width: 30px;
            height: 30px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
            margin-top: 20px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .button {
            display: inline-block;
            background: white;
            color: #667eea;
            padding: 12px 24px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <span>🧠</span>
        </div>
        <h1>BrainStorm Profile</h1>
        <p>Redirecting to BrainStorm app...</p>
        <div class="loading"></div>
        <br>
        <a href="#" class="button" id="openApp">Open in App</a>
    </div>

    <script>
        // Get profile ID from URL
        const path = window.location.pathname;
        let profileId = path.split('/').pop();
        
        // Remove .html extension if present
        if (profileId.endsWith('.html')) {
            profileId = profileId.replace('.html', '');
        }
        
        // Deep link URL
        const deepLinkUrl = `brainstorm://profile/${profileId}`;
        
        // Update button link
        document.getElementById('openApp').href = deepLinkUrl;
        
        // Auto redirect after 2 seconds
        setTimeout(() => {
            window.location.href = deepLinkUrl;
        }, 2000);
        
        // Fallback: if app not installed, show message
        setTimeout(() => {
            document.querySelector('.loading').style.display = 'none';
            document.querySelector('p').innerHTML = 'Don\'t have BrainStorm?<br><a href="https://play.google.com/store/apps/details?id=com.dajaistudio.brainstorm" style="color: white;">Download from Play Store</a>';
        }, 5000);
    </script>
</body>
</html>
